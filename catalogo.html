<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Cursos | EduTrack</title>
    <link rel="stylesheet" href="css/dashboard_styles.css">
    <link rel="stylesheet" href="css/catalogo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-topbar">
        <button id="menu-toggle" class="menu-btn" aria-label="Alternar menú">
            <div class="hamburger">
                <span></span><span></span><span></span><span></span>
            </div>
        </button>
        <span class="mobile-brand">EduTrack</span>
        <div class="mobile-spacer"></div>
    </div>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-logo-text">EduTrack.</h1>
                <button id="close-sidebar" class="close-btn-mobile" aria-label="Cerrar menú">&times;</button>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" onclick="alert('La sección de Mis Rutas se encuentra en desarrollo.'); return false;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                            <span>Mis Rutas</span>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="catalogo.html" class="nav-link">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <span>Catálogo</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="estudiantes.html" class="nav-link">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            <span>Estudiantes</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <img src="https://placehold.co/40x40?text=U" alt="Avatar del usuario" class="user-avatar">
                    <div class="user-info">
                        <span class="user-name">Estudiante</span>
                        <span class="user-role">Frontend Dev</span>
                    </div>
                </div>
                <button id="btn-logout-dashboard" class="btn-logout" aria-label="Cerrar sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>Salir</span>
                </button>
            </div>
        </aside>

        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <main class="main-content" id="catalog-app">
            <!-- El contenido se renderizará dinámicamente desde catalogo.js -->
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
